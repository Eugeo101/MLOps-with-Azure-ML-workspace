name: Deploy model to online endpoint (PR comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy-prod:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/deploy-prod')
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Azure SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI
        run: |
          az extension add -n ml -y

      - name: Configure Azure ML environment
        id: setup-azure
        run: |
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          RESOURCE_GROUP="${{ vars.AZURE_RESOURCE_GROUP }}"
          WORKSPACE_NAME="${{ vars.AZURE_WORKSPACE_NAME }}"
          ENDPOINT_NAME="diabetes-endpoint-prod"

          az configure --defaults group="$RESOURCE_GROUP" workspace="$WORKSPACE_NAME"

          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "resource_group=$RESOURCE_GROUP" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE_NAME" >> "$GITHUB_OUTPUT"
          echo "endpoint_name=$ENDPOINT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download model artifact from Azure ML job
        run: |
          az ml job download --name "${{ steps.train.outputs.job_name }}" --output-name "model" --download-path ./model --resource-group "${{ steps.setup-azure.outputs.resource_group }}" --workspace-name "${{ steps.setup-azure.outputs.workspace }}"

      - name: Deploy model to managed online endpoint
        id: deploy
        run: |
          python src_environments/deploy_to_online_endpoint.py \
            --subscription-id "${{ steps.setup-azure.outputs.subscription_id }}" \
            --resource-group "${{ steps.setup-azure.outputs.resource_group }}" \
            --workspace "${{ steps.setup-azure.outputs.workspace }}" \
            --endpoint-name "${{ steps.setup-azure.outputs.endpoint_name }}" \
            --deployment-name "blue"

      - name: Comment deployment result on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const endpointName = '${{ steps.setup-azure.outputs.endpoint_name }}';

            const body = [
              '🚀 Deployment workflow completed.',
              '',
              'The diabetes model has been deployed (or updated) on the managed online endpoint.',
              '',
              `Endpoint name: \`${endpointName}\``,
              'Deployment name: `blue`',
              'Data collection for model inputs and outputs is enabled on this deployment.',
              '',
              'Check the workflow run logs for the endpoint scoring URI and verify the endpoint in Azure Machine Learning studio.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });